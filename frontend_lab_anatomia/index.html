<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendamento – Laboratório de Anatomia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-top: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }

        tr:hover {
            background-color: #f2f2f2;
            cursor: pointer;
        }

        .btn {
            padding: 6px 12px;
            cursor: pointer;
        }

        .btn-cancelar {
            background-color: #c62828;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<h1>Agendamento de Salas – Laboratório de Anatomia</h1>

<!-- SALAS -->
<h2>1. Salas</h2>
<table id="tabelaSalas">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Capacidade</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- DATA -->
<h2>2. Data</h2>
<input type="date" id="dataSelecionada">

<!-- DISPONIBILIDADE -->
<h2>3. Horários</h2>
<table id="tabelaHorarios">
    <thead>
        <tr>
            <th>Início</th>
            <th>Fim</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- FORMULÁRIO -->
<h2>4. Criar Agendamento</h2>
<form id="formAgendamento">
    <label>Matrícula:</label><br>
    <input type="number" id="matricula" required><br><br>

    <label>Hora início:</label><br>
    <input type="time" id="horaInicio" required><br><br>

    <label>Hora fim:</label><br>
    <input type="time" id="horaFim" required><br><br>

    <label>Finalidade:</label><br>
    <input type="text" id="finalidade"><br><br>

    <button class="btn" type="submit">Agendar</button>
</form>

<!-- AGENDAMENTOS -->
<h2>5. Agendamentos</h2>
<table id="tabelaAgendamentos">
    <thead>
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Início</th>
            <th>Fim</th>
            <th>Status</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="js/api.js"></script>
<script src="js/salas.js"></script>
<script src="js/agendamentos.js"></script>
<script src="js/main.js"></script>

</body>
</html>
