services:
  mysql:
    image: mysql:8.0
    container_name: mysql_laboratorio
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio_anatomia
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/ddl.sql:/docker-entrypoint-initdb.d/1-setup.sql
      - ./sql/dml.sql:/docker-entrypoint-initdb.d/2-data.sql

volumes:
  mysql_data:
